name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  TEST_DATABASE_URL: postgresql://bridge:bridge@localhost:5432/the_bridge_test

jobs:
  release:
    name: Verify and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: the_bridge_test
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge -d the_bridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release source
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm --filter api test:e2e --runInBand
          pnpm build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --generate-notes
          --title "THE BRIDGE $GITHUB_REF_NAME"
